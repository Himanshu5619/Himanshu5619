<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <defs>
    <linearGradient id="connectBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D20"/>
      <stop offset="50%" stop-color="#0C1533"/>
      <stop offset="100%" stop-color="#101D40"/>
    </linearGradient>

    <linearGradient id="connectBoxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101D40"/>
      <stop offset="100%" stop-color="#0A1535"/>
    </linearGradient>

    <filter id="glowConnect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .font-mono { font-family: 'Fira Code', 'Courier New', monospace; }
      .font-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      @keyframes floatChar {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .float-char { animation: floatChar 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="876" height="256" rx="18" fill="url(#connectBg)" stroke="#253560" stroke-width="1.5"/>

  <!-- Left: Developer Avatar Illustration pointing / waving -->
  <g transform="translate(35, 30)" class="float-char">
    <!-- Ambient Glow Circle -->
    <circle cx="85" cy="100" r="75" fill="#9457FF" opacity="0.12" filter="url(#glowConnect)"/>
    <circle cx="85" cy="100" r="70" fill="#0E193C" stroke="#253560" stroke-width="1.5"/>

    <!-- Developer Character -->
    <g transform="translate(35, 30)">
      <!-- Shoulders -->
      <path d="M 15 110 C 15 78 35 72 50 72 C 65 72 85 78 85 110 Z" fill="#14234A" stroke="#293D72" stroke-width="1.5"/>
      <path d="M 38 74 L 50 92 L 62 74 Z" fill="#00D5FF"/>
      <!-- Face -->
      <ellipse cx="50" cy="50" rx="25" ry="26" fill="#FCE2D4"/>
      <!-- Hair -->
      <path d="M 25 45 C 25 24 38 16 50 16 C 62 16 75 24 75 45 C 70 32 60 26 50 26 C 40 26 30 32 25 45 Z" fill="#1B1C2E"/>
      <!-- Glasses -->
      <rect x="33" y="44" width="13" height="9" rx="2" fill="none" stroke="#00D5FF" stroke-width="1.6"/>
      <rect x="54" y="44" width="13" height="9" rx="2" fill="none" stroke="#00D5FF" stroke-width="1.6"/>
      <line x1="46" y1="48" x2="54" y2="48" stroke="#00D5FF" stroke-width="1.6"/>
      <!-- Smile -->
      <path d="M 45 61 Q 50 65 55 61" fill="none" stroke="#4A342B" stroke-width="1.5"/>
      <!-- Headset -->
      <path d="M 25 48 C 23 28 35 18 50 18 C 65 18 77 28 75 48" fill="none" stroke="#E34DDB" stroke-width="2.5"/>
      <rect x="22" y="42" width="6" height="12" rx="3" fill="#E34DDB"/>
      <rect x="72" y="42" width="6" height="12" rx="3" fill="#E34DDB"/>
    </g>

    <!-- Speech bubble: Let's talk tech! -->
    <g transform="translate(100, 15)">
      <rect x="0" y="0" width="115" height="26" rx="8" fill="#101D40" stroke="#E34DDB" stroke-width="1"/>
      <path d="M 12 26 L 6 32 L 20 26 Z" fill="#101D40"/>
      <text x="12" y="17" fill="#E34DDB" font-size="11" font-weight="700" class="font-mono">let's talk tech! 💬</text>
    </g>
  </g>

  <!-- Right Area: Header & 2x2 Connect Grid -->
  <g transform="translate(265, 32)">
    <!-- Header -->
    <text x="0" y="0" fill="#E34DDB" font-size="11.5" font-weight="700" letter-spacing="1.5" class="font-mono">// LET'S CONNECT</text>
    <text x="0" y="26" fill="#F4F7FF" font-size="22" font-weight="800" class="font-sans">Let's build something together</text>
    <text x="0" y="46" fill="#A7B6D8" font-size="13" class="font-sans">Open to cloud architecture collabs, DevOps automation, and scalable systems.</text>

    <!-- 2x2 Interactive Cards Grid -->
    <g transform="translate(0, 64)">
      <!-- Card 1: GitHub -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="280" height="42" rx="8" fill="url(#connectBoxBg)" stroke="#1F3668" stroke-width="1"/>
        <circle cx="22" cy="21" r="10" fill="#181717"/>
        <text x="22" y="25" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="900" class="font-mono">&lt;&gt;</text>
        <text x="42" y="19" fill="#7284AC" font-size="9.5" font-weight="700" class="font-mono">GITHUB</text>
        <text x="42" y="32" fill="#F4F7FF" font-size="11.5" font-weight="600" class="font-sans">Himanshu5619</text>
      </g>

      <!-- Card 2: Email -->
      <g transform="translate(295, 0)">
        <rect x="0" y="0" width="280" height="42" rx="8" fill="url(#connectBoxBg)" stroke="#1F3668" stroke-width="1"/>
        <circle cx="22" cy="21" r="10" fill="#6D4AFF"/>
        <text x="22" y="25" text-anchor="middle" fill="#FFFFFF" font-size="10" class="font-sans">✉</text>
        <text x="42" y="19" fill="#7284AC" font-size="9.5" font-weight="700" class="font-mono">EMAIL</text>
        <text x="42" y="32" fill="#F4F7FF" font-size="11.5" font-weight="600" class="font-sans">himanshu.s19@proton.me</text>
      </g>

      <!-- Card 3: LinkedIn -->
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="280" height="42" rx="8" fill="url(#connectBoxBg)" stroke="#1F3668" stroke-width="1"/>
        <circle cx="22" cy="21" r="10" fill="#0077B5"/>
        <text x="22" y="25" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" class="font-sans">in</text>
        <text x="42" y="19" fill="#7284AC" font-size="9.5" font-weight="700" class="font-mono">LINKEDIN</text>
        <text x="42" y="32" fill="#F4F7FF" font-size="11.5" font-weight="600" class="font-sans">himanshu-singh-b3aa71218</text>
      </g>

      <!-- Card 4: Portfolio -->
      <g transform="translate(295, 52)">
        <rect x="0" y="0" width="280" height="42" rx="8" fill="url(#connectBoxBg)" stroke="#1F3668" stroke-width="1"/>
        <circle cx="22" cy="21" r="10" fill="#10B981"/>
        <text x="22" y="25" text-anchor="middle" fill="#FFFFFF" font-size="10" class="font-sans">🌐</text>
        <text x="42" y="19" fill="#7284AC" font-size="9.5" font-weight="700" class="font-mono">PORTFOLIO</text>
        <text x="42" y="32" fill="#F4F7FF" font-size="11.5" font-weight="600" class="font-sans">himanshu5619.github.io</text>
      </g>
    </g>

    <!-- Bottom Quote Banner -->
    <g transform="translate(0, 175)">
      <text x="0" y="0" fill="#7284AC" font-size="12" font-style="italic" class="font-sans">"Code is my art, logic is my superpower."</text>
    </g>
  </g>
</svg>
