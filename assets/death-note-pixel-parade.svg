<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 70" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;800&amp;display=swap');
      .font-mono { font-family: 'JetBrains Mono', monospace; }

      @keyframes floatRyuk {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-7px) rotate(2deg); }
      }
      @keyframes floatApple {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-5px) rotate(15deg); }
      }
      @keyframes stepLight {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes pulseEye {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #FF1E27); }
        50% { opacity: 0.6; filter: drop-shadow(0 0 1px #FF1E27); }
      }
      @keyframes crawlTrack {
        0% { transform: translateX(0); }
        100% { transform: translateX(-480px); }
      }

      .ryuk-anim { animation: floatRyuk 3s infinite ease-in-out; }
      .apple-anim { animation: floatApple 2s infinite ease-in-out; }
      .light-anim { animation: stepLight 1.2s infinite ease-in-out; }
      .eye-pulse { animation: pulseEye 1.5s infinite ease-in-out; }
    </style>

    <linearGradient id="paradeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#08080C"/>
      <stop offset="50%" stop-color="#140A10"/>
      <stop offset="100%" stop-color="#08080C"/>
    </linearGradient>

    <linearGradient id="groundLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F202C"/>
      <stop offset="30%" stop-color="#FF1E27"/>
      <stop offset="70%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#1F202C"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="0" y="0" width="960" height="70" rx="10" fill="url(#paradeBg)" stroke="#261219" stroke-width="1.2"/>
  
  <!-- Ground track line -->
  <line x1="20" y1="56" x2="940" y2="56" stroke="url(#groundLine)" stroke-width="1.5" stroke-dasharray="8 4"/>

  <!-- Left label -->
  <text x="35" y="38" fill="#64748B" font-size="10.5" font-weight="700" class="font-mono">// SHINIGAMI CORPS</text>
  <circle cx="165" cy="35" r="3" fill="#FF1E27" class="eye-pulse"/>

  <!-- Center Chibi Parade -->
  <g transform="translate(230, 8)">
    
    <!-- 1. CHIBI RYUK (Floating with wings & apple) -->
    <g class="ryuk-anim" transform="translate(40, 6)">
      <!-- Shadow on ground -->
      <ellipse cx="20" cy="46" rx="14" ry="3" fill="#000000" opacity="0.4"/>

      <!-- Wings -->
      <path d="M 12 18 C 0 8 -8 18 -4 28 C 4 24 10 24 12 24 Z" fill="#181B26" stroke="#33374C" stroke-width="0.8"/>
      <path d="M 28 18 C 40 8 48 18 44 28 C 36 24 30 24 28 24 Z" fill="#181B26" stroke="#33374C" stroke-width="0.8"/>
      
      <!-- Body & Spiky Collar -->
      <rect x="14" y="20" width="12" height="18" rx="3" fill="#11131C"/>
      <path d="M 12 20 L 16 24 L 20 20 L 24 24 L 28 20" stroke="#7C3AED" stroke-width="1.2" fill="none"/>
      
      <!-- Spiky Hair -->
      <path d="M 12 12 L 8 4 L 14 8 L 18 2 L 22 8 L 28 3 L 26 10 L 32 6 L 28 14 Z" fill="#0A0B10" stroke="#3B1828" stroke-width="0.8"/>
      
      <!-- Head -->
      <ellipse cx="20" cy="14" rx="8" ry="7" fill="#E2E8F0"/>
      <!-- Eyes (Yellow / Crimson) -->
      <circle cx="17" cy="13" r="2" fill="#FF1E27"/>
      <circle cx="23" cy="13" r="2" fill="#FF1E27"/>
      <circle cx="17" cy="13" r="0.8" fill="#FFFF00"/>
      <circle cx="23" cy="13" r="0.8" fill="#FFFF00"/>
      <!-- Ryuk Wide Grin -->
      <path d="M 15 16 Q 20 20 25 16" stroke="#111827" stroke-width="1.2" fill="none"/>
      
      <!-- Tiny Apple held in hand -->
      <g transform="translate(28, 22)">
        <circle cx="4" cy="4" r="3.5" fill="#EF4444"/>
        <path d="M 4 1 Q 5 0 6 0" stroke="#15803D" stroke-width="0.8" fill="none"/>
      </g>
    </g>

    <!-- 2. BOUNCING RED APPLE -->
    <g class="apple-anim" transform="translate(130, 22)">
      <circle cx="6" cy="6" r="6" fill="#DC2626" stroke="#7F1D1D" stroke-width="0.8"/>
      <path d="M 6 1 Q 8 -2 10 -2" stroke="#16A34A" stroke-width="1" fill="none"/>
      <ellipse cx="4" cy="4" rx="2" ry="3" fill="#FCA5A5" opacity="0.6"/>
    </g>

    <!-- 3. CHIBI LIGHT YAGAMI (Holding Death Note & Pen) -->
    <g class="light-anim" transform="translate(190, 10)">
      <!-- Hair (Light brown anime style) -->
      <path d="M 8 12 C 6 2 26 2 24 12 L 26 15 L 22 14 L 18 16 L 14 14 L 10 15 Z" fill="#92400E"/>
      <!-- Face -->
      <ellipse cx="16" cy="15" rx="7" ry="6" fill="#FDE68A"/>
      <!-- Eyes & Smirk -->
      <ellipse cx="14" cy="15" rx="1.2" ry="1.5" fill="#78350F"/>
      <ellipse cx="18" cy="15" rx="1.2" ry="1.5" fill="#78350F"/>
      <path d="M 14 18 Q 16 19 18 17.5" stroke="#78350F" stroke-width="0.8" fill="none"/>

      <!-- School Blazer / Coat -->
      <rect x="11" y="21" width="10" height="15" rx="2" fill="#B45309"/>
      <rect x="14" y="21" width="4" height="15" fill="#DC2626"/> <!-- Red tie -->
      <!-- Legs -->
      <line x1="13" y1="36" x2="13" y2="44" stroke="#1E293B" stroke-width="2.5"/>
      <line x1="19" y1="36" x2="19" y2="44" stroke="#1E293B" stroke-width="2.5"/>

      <!-- Death Note in hand -->
      <rect x="22" y="23" width="7" height="10" rx="1" fill="#0A0A0C" stroke="#FFFFFF" stroke-width="0.5"/>
      <!-- Quill / Pen -->
      <line x1="26" y1="21" x2="30" y2="17" stroke="#F1F5F9" stroke-width="1"/>
    </g>

    <!-- 4. FLOATING DEATH NOTE -->
    <g class="apple-anim" transform="translate(270, 18)">
      <rect x="0" y="0" width="16" height="22" rx="2" fill="#07070A" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="8" y="9" text-anchor="middle" fill="#FFFFFF" font-size="4" font-weight="900" class="font-mono">DEATH</text>
      <text x="8" y="14" text-anchor="middle" fill="#FFFFFF" font-size="4" font-weight="900" class="font-mono">NOTE</text>
    </g>

    <!-- 5. CHIBI L (Lawliet) (Crouched, messy hair, teacup) -->
    <g class="light-anim" transform="translate(330, 12)">
      <!-- Messy Jet Black Hair -->
      <path d="M 8 14 L 6 8 L 10 9 L 10 3 L 15 7 L 18 1 L 20 7 L 24 3 L 23 9 L 27 7 L 24 14 Z" fill="#0A0A0C"/>
      <!-- Pale Face -->
      <ellipse cx="16" cy="15" rx="7" ry="6" fill="#F8FAFC"/>
      <!-- Dark eye circles -->
      <ellipse cx="13" cy="15" rx="2.5" ry="2" fill="#E2E8F0" stroke="#94A3B8" stroke-width="0.8"/>
      <circle cx="13" cy="15" r="1.2" fill="#0F172A"/>
      <ellipse cx="19" cy="15" rx="2.5" ry="2" fill="#E2E8F0" stroke="#94A3B8" stroke-width="0.8"/>
      <circle cx="19" cy="15" r="1.2" fill="#0F172A"/>

      <!-- White baggy long-sleeve shirt (crouched posture) -->
      <ellipse cx="16" cy="27" rx="8" ry="7" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.8"/>
      <!-- Blue jeans (bent knees) -->
      <path d="M 9 32 Q 6 38 10 44 L 14 44 Q 12 36 14 32" fill="#1E3A8A"/>
      <path d="M 23 32 Q 26 38 22 44 L 18 44 Q 20 36 18 32" fill="#1E3A8A"/>
      <!-- Holding Strawberry / Teacup -->
      <circle cx="8" cy="25" r="2.5" fill="#EF4444"/>
      <path d="M 8 22.5 L 9 21.5" stroke="#16A34A" stroke-width="0.6"/>
    </g>

    <!-- 6. CHIBI MISA AMANE (Blonde with Glowing Red Eyes) -->
    <g class="light-anim" transform="translate(420, 10)">
      <!-- Blonde Pigtails -->
      <path d="M 7 14 C 4 8 8 2 16 2 C 24 2 28 8 25 14 Z" fill="#FCD34D"/>
      <path d="M 6 8 L 2 18 C 2 22 5 24 7 18 Z" fill="#FCD34D"/> <!-- Left pigtail -->
      <path d="M 26 8 L 30 18 C 30 22 27 24 25 18 Z" fill="#FCD34D"/> <!-- Right pigtail -->
      <!-- Face -->
      <ellipse cx="16" cy="14" rx="6.5" ry="6" fill="#FEF3C7"/>
      <!-- Shinigami Glowing Red Eyes -->
      <circle cx="13.5" cy="14" r="1.8" fill="#FF1E27" class="eye-pulse"/>
      <circle cx="18.5" cy="14" r="1.8" fill="#FF1E27" class="eye-pulse"/>
      <!-- Gothic Lolita Black Dress -->
      <path d="M 11 20 L 21 20 L 24 36 L 8 36 Z" fill="#0F172A" stroke="#7C3AED" stroke-width="0.6"/>
      <!-- Cross Necklace -->
      <path d="M 16 21 L 16 25 M 14.5 23 L 17.5 23" stroke="#CBD5E1" stroke-width="0.8"/>
      <!-- Legs with lace socks -->
      <line x1="13" y1="36" x2="13" y2="44" stroke="#000000" stroke-width="2"/>
      <line x1="19" y1="36" x2="19" y2="44" stroke="#000000" stroke-width="2"/>
    </g>

  </g>

  <!-- Right status text -->
  <text x="890" y="38" text-anchor="end" fill="#94A3B8" font-size="10" font-weight="600" class="font-mono">KIRA INVESTIGATION v4.2</text>
</svg>

