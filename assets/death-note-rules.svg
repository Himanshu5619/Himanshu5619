<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap');
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      .font-gothic { font-family: 'Cinzel', serif; }

      @keyframes eyeBlink {
        0%, 100% { filter: drop-shadow(0 0 4px #FF1E27); }
        50% { filter: drop-shadow(0 0 10px #FF1E27); }
      }
      @keyframes floatApples {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .shinigami-eye { animation: eyeBlink 2s infinite ease-in-out; }
      .apple-float { animation: floatApples 3s infinite ease-in-out; }
    </style>

    <linearGradient id="rulesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080C"/>
      <stop offset="50%" stop-color="#0E0F17"/>
      <stop offset="100%" stop-color="#08080C"/>
    </linearGradient>

    <linearGradient id="leatherCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141E"/>
      <stop offset="50%" stop-color="#0B0B12"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <linearGradient id="crimsonAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E27"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="956" height="276" rx="12" fill="url(#rulesBg)" stroke="#301A24" stroke-width="1.5"/>

  <!-- ==================== LEFT CARD: DEATH NOTE COVER & RYUK ==================== -->
  <g transform="translate(18, 16)">
    <!-- Book Cover Base -->
    <rect x="0" y="0" width="350" height="248" rx="8" fill="url(#leatherCover)" stroke="#3E202B" stroke-width="1.2"/>
    
    <!-- Outer Gothic Filigree Border -->
    <rect x="8" y="8" width="334" height="232" rx="6" fill="none" stroke="#25161E" stroke-width="1"/>
    
    <!-- Corner Ornaments -->
    <path d="M 12 24 L 24 12 M 12 12 L 28 12 M 12 12 L 12 28" stroke="#FF1E27" stroke-width="1.2" opacity="0.6"/>
    <path d="M 338 24 L 326 12 M 338 12 L 322 12 M 338 12 L 338 28" stroke="#FF1E27" stroke-width="1.2" opacity="0.6"/>
    <path d="M 12 224 L 24 236 M 12 236 L 28 236 M 12 236 L 12 220" stroke="#FF1E27" stroke-width="1.2" opacity="0.6"/>
    <path d="M 338 224 L 326 236 M 338 236 L 322 236 M 338 236 L 338 220" stroke="#FF1E27" stroke-width="1.2" opacity="0.6"/>

    <!-- DEATH NOTE Title -->
    <g transform="translate(175, 42)" text-anchor="middle">
      <text x="0" y="0" fill="#F8FAFC" font-size="22" font-weight="900" letter-spacing="4" class="font-gothic">DEATH NOTE</text>
      <text x="0" y="15" fill="#881337" font-size="8.5" font-weight="700" letter-spacing="3" class="font-mono">// HOW TO DEPLOY //</text>
    </g>

    <!-- Ryuk Silhouette Artwork inside Book Frame -->
    <g transform="translate(175, 135)">
      <!-- Red Glowing Moon -->
      <circle cx="0" cy="-10" r="46" fill="#1C0A10" stroke="#991B1B" stroke-width="1.2"/>
      
      <!-- Wings Spanning -->
      <path d="M -15 -10 C -45 -35 -80 -25 -100 -5 C -75 5 -45 5 -20 0 Z" fill="#0A0B10" stroke="#451420" stroke-width="0.8"/>
      <path d="M 15 -10 C 45 -35 80 -25 100 -5 C 75 5 45 5 20 0 Z" fill="#0A0B10" stroke="#451420" stroke-width="0.8"/>

      <!-- Ryuk Head & Shoulders -->
      <path d="M -16 18 C -14 0 14 0 16 18 L 22 45 L -22 45 Z" fill="#0F111A"/>
      <!-- Face -->
      <ellipse cx="0" cy="-5" rx="14" ry="16" fill="#D1D5DB"/>
      <!-- Wild Hair -->
      <path d="M -14 -12 L -22 -24 L -12 -18 L -6 -30 L 0 -20 L 6 -30 L 12 -18 L 22 -24 L 14 -12 Z" fill="#0A0B10"/>
      <!-- Glowing Red Shinigami Eyes -->
      <circle cx="-5" cy="-8" r="3.5" fill="#FF1E27" class="shinigami-eye"/>
      <circle cx="-5" cy="-8" r="1.5" fill="#FEF08A"/>
      <circle cx="5" cy="-8" r="3.5" fill="#FF1E27" class="shinigami-eye"/>
      <circle cx="5" cy="-8" r="1.5" fill="#FEF08A"/>
      <!-- Grin -->
      <path d="M -8 -1 Q 0 8 8 -1 Q 0 2 -8 -1" fill="#111827" stroke="#111827" stroke-width="0.5"/>
      <polygon points="-6,-1 -4,2 -2,-1" fill="#F9FAFB"/>
      <polygon points="-2,-1 0,3 2,-1" fill="#F9FAFB"/>
      <polygon points="2,-1 4,2 6,-1" fill="#F9FAFB"/>

      <!-- Apple in Foreground -->
      <g class="apple-float" transform="translate(18, 12)">
        <circle cx="10" cy="10" r="10" fill="#DC2626" stroke="#7F1D1D" stroke-width="0.8"/>
        <path d="M 10 2 Q 13 -2 16 -1" stroke="#15803D" stroke-width="1.2" fill="none"/>
        <ellipse cx="7" cy="7" rx="3" ry="5" fill="#FCA5A5" opacity="0.6"/>
      </g>
    </g>

    <!-- Bottom Book Quote -->
    <text x="175" y="226" text-anchor="middle" fill="#64748B" font-size="10" font-style="italic" class="font-mono">"Humans are... truly fascinating." — Ryuk</text>
  </g>

  <!-- ==================== RIGHT CARD: CODEX & RULES TABLE ==================== -->
  <g transform="translate(385, 16)">
    <!-- Rules Container -->
    <rect x="0" y="0" width="555" height="248" rx="8" fill="#0B0C14" stroke="#2B1A24" stroke-width="1.2"/>
    
    <!-- Rules Header Ribbon -->
    <path d="M 0 8 Q 0 0 8 0 L 547 0 Q 555 0 555 8 L 555 36 L 0 36 Z" fill="#150E17"/>
    <line x1="0" y1="36" x2="555" y2="36" stroke="#381824" stroke-width="1"/>

    <!-- Header Text -->
    <text x="20" y="23" fill="#FF1E27" font-size="12" font-weight="900" letter-spacing="1.5" class="font-gothic">HOW TO USE IT : RULES OF THE CODE NOTE</text>
    <text x="535" y="23" text-anchor="end" fill="#64748B" font-size="10" font-weight="600" class="font-mono">PAGE 01 / ∞</text>

    <!-- 5 Rules List -->
    <g transform="translate(20, 52)">
      
      <!-- Rule 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="56" height="18" rx="3" fill="#2A0F16"/>
        <text x="28" y="13" text-anchor="middle" fill="#FF4D55" font-size="9" font-weight="800" class="font-mono">RULE I</text>
        <text x="68" y="13" fill="#E2E8F0" font-size="10.5" font-weight="600" class="font-mono">The bug whose name is written in this repo shall be resolved.</text>
      </g>

      <!-- Rule 2 -->
      <g transform="translate(0, 36)">
        <rect x="0" y="0" width="56" height="18" rx="3" fill="#1C1324"/>
        <text x="28" y="13" text-anchor="middle" fill="#C084FC" font-size="9" font-weight="800" class="font-mono">RULE II</text>
        <text x="68" y="13" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-mono">This note only executes if the stack trace is clearly kept in mind.</text>
      </g>

      <!-- Rule 3 -->
      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="56" height="18" rx="3" fill="#2A0F16"/>
        <text x="28" y="13" text-anchor="middle" fill="#FF4D55" font-size="9" font-weight="800" class="font-mono">RULE III</text>
        <text x="68" y="13" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-mono">If root cause is entered in 40s, zero-downtime CI/CD triggers.</text>
      </g>

      <!-- Rule 4 -->
      <g transform="translate(0, 108)">
        <rect x="0" y="0" width="56" height="18" rx="3" fill="#141E1C"/>
        <text x="28" y="13" text-anchor="middle" fill="#34D399" font-size="9" font-weight="800" class="font-mono">RULE IV</text>
        <text x="68" y="13" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-mono">Infrastructure must remain defined as Code (IaC) via Terraform.</text>
      </g>

      <!-- Rule 5 -->
      <g transform="translate(0, 144)">
        <rect x="0" y="0" width="56" height="18" rx="3" fill="#2A0F16"/>
        <text x="28" y="13" text-anchor="middle" fill="#FF4D55" font-size="9" font-weight="800" class="font-mono">RULE V</text>
        <text x="68" y="13" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-mono">The Shinigami developer demands fresh red apples at each sprint.</text>
      </g>
    </g>

    <!-- Bottom Status Note -->
    <g transform="translate(20, 226)">
      <line x1="0" y1="-8" x2="515" y2="-8" stroke="#1F2130" stroke-width="1"/>
      <text x="0" y="5" fill="#64748B" font-size="9.5" class="font-mono">ALL RULES REVISED UNDER GITHUB ACTIONS &amp; DEV SEC OPS DIRECTIVES</text>
    </g>
  </g>
</svg>

