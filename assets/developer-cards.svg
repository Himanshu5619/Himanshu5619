<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091024"/>
      <stop offset="100%" stop-color="#0E193C"/>
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D5FF"/>
      <stop offset="100%" stop-color="#1685FF"/>
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9457FF"/>
      <stop offset="100%" stop-color="#E34DDB"/>
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .font-mono { font-family: 'Fira Code', 'Courier New', monospace; }
      .font-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      @keyframes floatDev {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      .floating { animation: floatDev 4s infinite ease-in-out; }
    </style>
  </defs>

  <!-- ==================== LEFT CARD: // DEVELOPER ==================== -->
  <g transform="translate(0, 0)">
    <rect x="2" y="2" width="426" height="266" rx="16" fill="url(#cardBg)" stroke="#253560" stroke-width="1.5"/>

    <!-- Category Header -->
    <text x="28" y="36" fill="#00D5FF" font-size="12" font-weight="700" letter-spacing="1.5" class="font-mono">// DEVELOPER</text>

    <!-- Main Title -->
    <text x="28" y="66" fill="#F4F7FF" font-size="20" font-weight="800" class="font-sans">Architecting for resilience</text>

    <!-- Coding Illustration Area -->
    <g transform="translate(240, 20)" class="floating">
      <!-- Desk Lamp -->
      <path d="M 130 90 L 110 50 L 125 45" fill="none" stroke="#253560" stroke-width="2.5"/>
      <polygon points="120,40 140,50 115,60" fill="#E34DDB" opacity="0.8"/>
      <polygon points="120,50 60,110 150,110" fill="#00D5FF" opacity="0.08"/>

      <!-- Monitor -->
      <rect x="35" y="45" width="70" height="48" rx="4" fill="#060C1E" stroke="#00D5FF" stroke-width="1.5"/>
      <rect x="65" y="93" width="10" height="15" fill="#253560"/>
      <rect x="55" y="108" width="30" height="3" rx="1" fill="#253560"/>
      <!-- Code on Screen -->
      <line x1="42" y1="55" x2="65" y2="55" stroke="#00D5FF" stroke-width="2"/>
      <line x1="42" y1="63" x2="85" y2="63" stroke="#9457FF" stroke-width="2"/>
      <line x1="42" y1="71" x2="75" y2="71" stroke="#26D7B5" stroke-width="2"/>
      <line x1="42" y1="79" x2="90" y2="79" stroke="#E34DDB" stroke-width="2"/>

      <!-- Coffee Mug -->
      <rect x="115" y="98" width="10" height="13" rx="2" fill="#253560"/>
      <path d="M 125 101 C 129 101 129 107 125 107" fill="none" stroke="#253560" stroke-width="1.5"/>
      <path d="M 118 94 Q 120 90 118 86" fill="none" stroke="#A7B6D8" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- Feature Tags (Pills) -->
    <g transform="translate(28, 102)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="370" height="36" rx="8" fill="#101D40" stroke="#1F3668" stroke-width="1"/>
        <circle cx="20" cy="18" r="5" fill="#00D5FF"/>
        <text x="36" y="23" fill="#F4F7FF" font-size="12.5" font-weight="600" class="font-sans">Scalable multi-cloud infrastructure</text>
        <text x="36" y="32" fill="#7284AC" font-size="9" class="font-mono">AWS • Azure • Google Cloud Architecture</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(0, 48)">
        <rect x="0" y="0" width="370" height="36" rx="8" fill="#101D40" stroke="#1F3668" stroke-width="1"/>
        <circle cx="20" cy="18" r="5" fill="#9457FF"/>
        <text x="36" y="23" fill="#F4F7FF" font-size="12.5" font-weight="600" class="font-sans">Automated CI/CD &amp; GitOps pipelines</text>
        <text x="36" y="32" fill="#7284AC" font-size="9" class="font-mono">GitHub Actions • Jenkins • Seamless Delivery</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(0, 96)">
        <rect x="0" y="0" width="370" height="36" rx="8" fill="#101D40" stroke="#1F3668" stroke-width="1"/>
        <circle cx="20" cy="18" r="5" fill="#26D7B5"/>
        <text x="36" y="23" fill="#F4F7FF" font-size="12.5" font-weight="600" class="font-sans">Containers, microservices &amp; IaC</text>
        <text x="36" y="32" fill="#7284AC" font-size="9" class="font-mono">Docker • Kubernetes • Terraform Automation</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT CARD: // OFF THE CLOCK ==================== -->
  <g transform="translate(452, 0)">
    <rect x="2" y="2" width="426" height="266" rx="16" fill="url(#cardBg)" stroke="#253560" stroke-width="1.5"/>

    <!-- Category Header -->
    <text x="28" y="36" fill="#E34DDB" font-size="12" font-weight="700" letter-spacing="1.5" class="font-mono">// OFF THE CLOCK</text>

    <!-- Main Title -->
    <text x="28" y="66" fill="#F4F7FF" font-size="20" font-weight="800" class="font-sans">Healthy body, curious mind</text>

    <!-- Cute Chibi Illustration Area -->
    <g transform="translate(260, 20)" class="floating">
      <!-- Warm Ambient Circle -->
      <circle cx="80" cy="65" r="48" fill="#14234A" stroke="#E34DDB" stroke-width="1" stroke-dasharray="3,3"/>
      
      <!-- Ramen Bowl / Mug -->
      <ellipse cx="80" cy="85" rx="30" ry="12" fill="#0E1A38" stroke="#00D5FF" stroke-width="1.5"/>
      <path d="M 50 85 C 50 105 110 105 110 85 Z" fill="#0E1A38" stroke="#00D5FF" stroke-width="1.5"/>
      <!-- Chopsticks -->
      <line x1="65" y1="65" x2="105" y2="82" stroke="#E34DDB" stroke-width="2"/>
      <line x1="68" y1="62" x2="108" y2="79" stroke="#E34DDB" stroke-width="2"/>
      <!-- Steam -->
      <path d="M 72 75 Q 76 68 72 62" fill="none" stroke="#26D7B5" stroke-width="1.5" opacity="0.8"/>
      <path d="M 82 73 Q 86 66 82 60" fill="none" stroke="#26D7B5" stroke-width="1.5" opacity="0.8"/>
      <path d="M 92 75 Q 96 68 92 62" fill="none" stroke="#26D7B5" stroke-width="1.5" opacity="0.8"/>
    </g>

    <!-- Feature Description -->
    <text x="28" y="98" fill="#A7B6D8" font-size="12.5" class="font-sans">Where curiosity fuels breakthrough architectures.</text>

    <!-- Badges Grid -->
    <g transform="translate(28, 125)">
      <!-- Pill 1: Coffee & Cloud -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="175" height="42" rx="8" fill="#101D40" stroke="#1F3668" stroke-width="1"/>
        <text x="14" y="26" fill="#F4F7FF" font-size="13" font-weight="600" class="font-sans">☕ Cloud &amp; Coffee</text>
      </g>

      <!-- Pill 2: Move & Fitness -->
      <g transform="translate(190, 0)">
        <rect x="0" y="0" width="180" height="42" rx="8" fill="#101D40" stroke="#1F3668" stroke-width="1"/>
        <text x="14" y="26" fill="#F4F7FF" font-size="13" font-weight="600" class="font-sans">🏃 Move &amp; Fitness</text>
      </g>

      <!-- Pill 3: Lo-Fi Beats -->
      <g transform="translate(0, 56)">
        <rect x="0" y="0" width="175" height="42" rx="8" fill="#101D40" stroke="#1F3668" stroke-width="1"/>
        <text x="14" y="26" fill="#F4F7FF" font-size="13" font-weight="600" class="font-sans">🎧 Lo-Fi Beats</text>
      </g>

      <!-- Pill 4: Open Source -->
      <g transform="translate(190, 56)">
        <rect x="0" y="0" width="180" height="42" rx="8" fill="#101D40" stroke="#1F3668" stroke-width="1"/>
        <text x="14" y="26" fill="#F4F7FF" font-size="13" font-weight="600" class="font-sans">💻 Open Source</text>
      </g>
    </g>
  </g>
</svg>
