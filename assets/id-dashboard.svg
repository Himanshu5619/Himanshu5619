<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="100%" height="100%">
  <defs>
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D20"/>
      <stop offset="50%" stop-color="#0C1533"/>
      <stop offset="100%" stop-color="#101D40"/>
    </linearGradient>

    <linearGradient id="idCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121F45"/>
      <stop offset="100%" stop-color="#080D22"/>
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D5FF"/>
      <stop offset="100%" stop-color="#9457FF"/>
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9457FF"/>
      <stop offset="100%" stop-color="#E34DDB"/>
    </linearGradient>

    <linearGradient id="lanyardRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9457FF"/>
      <stop offset="50%" stop-color="#00D5FF"/>
      <stop offset="100%" stop-color="#9457FF"/>
    </linearGradient>

    <style>
      .font-mono { font-family: 'Fira Code', 'Courier New', monospace; }
      .font-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      @keyframes floatId {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-4px) rotate(0.4deg); }
      }
      .lanyard-badge { animation: floatId 5s ease-in-out infinite; transform-origin: 140px 10px; }
    </style>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="876" height="366" rx="18" fill="url(#dashBg)" stroke="#253560" stroke-width="1.5"/>

  <!-- Card Header -->
  <g transform="translate(35, 32)">
    <text x="0" y="0" fill="#00D5FF" font-size="12" font-weight="700" letter-spacing="1.5" class="font-mono">// DEVELOPER DASHBOARD</text>
    <text x="0" y="28" fill="#F4F7FF" font-size="22" font-weight="800" class="font-sans">Profile at a glance</text>
  </g>

  <!-- ==================== LEFT: CYBERPUNK LANYARD ID BADGE ==================== -->
  <g transform="translate(35, 70)" class="lanyard-badge">
    <!-- Lanyard Ribbon Straps hanging down from top -->
    <path d="M 125 -40 L 133 15 L 147 15 L 155 -40 Z" fill="url(#lanyardRibbon)" opacity="0.85"/>
    <!-- Metal Clip -->
    <rect x="131" y="10" width="18" height="18" rx="3" fill="#293D72" stroke="#00D5FF" stroke-width="1"/>
    <circle cx="140" cy="19" r="3.5" fill="#00D5FF"/>
    <!-- Metal Ring connecting to card -->
    <path d="M 136 28 C 136 36 144 36 144 28" fill="none" stroke="#A7B6D8" stroke-width="2"/>

    <!-- The ID Badge Body -->
    <rect x="30" y="34" width="220" height="250" rx="14" fill="url(#idCardBg)" stroke="#00D5FF" stroke-width="1.6"/>

    <!-- ID Card Header / Category -->
    <g transform="translate(42, 50)">
      <text x="0" y="0" fill="#7284AC" font-size="8.5" font-weight="700" letter-spacing="1" class="font-mono">DEVELOPER ID // v2.6</text>
      <!-- RFID/NFC waves symbol -->
      <path d="M 180 -4 A 8 8 0 0 1 180 8" fill="none" stroke="#00D5FF" stroke-width="1.2"/>
      <path d="M 184 -7 A 12 12 0 0 1 184 11" fill="none" stroke="#00D5FF" stroke-width="1.2"/>
      <path d="M 188 -10 A 16 16 0 0 1 188 14" fill="none" stroke="#00D5FF" stroke-width="1.2"/>
    </g>

    <!-- Golden Smart Security Chip -->
    <rect x="42" y="62" width="28" height="22" rx="3" fill="#E5A93C" stroke="#B8801A" stroke-width="1"/>
    <line x1="42" y1="73" x2="70" y2="73" stroke="#8C5C00" stroke-width="1"/>
    <line x1="56" y1="62" x2="56" y2="84" stroke="#8C5C00" stroke-width="1"/>

    <!-- Avatar Portrait inside ID -->
    <g transform="translate(85, 60)">
      <rect x="0" y="0" width="85" height="95" rx="8" fill="#0A1430" stroke="#9457FF" stroke-width="1.2"/>
      <!-- Chibi developer silhouette with headset -->
      <circle cx="42.5" cy="38" r="22" fill="#FCE2D4"/>
      <!-- Hair -->
      <path d="M 22 36 C 22 18 35 12 42.5 12 C 50 12 63 18 63 36 C 58 24 50 20 42.5 20 C 35 20 27 24 22 36 Z" fill="#1B1C2E"/>
      <!-- Glasses -->
      <rect x="29" y="34" width="11" height="8" rx="2" fill="none" stroke="#00D5FF" stroke-width="1.5"/>
      <rect x="45" y="34" width="11" height="8" rx="2" fill="none" stroke="#00D5FF" stroke-width="1.5"/>
      <line x1="40" y1="38" x2="45" y2="38" stroke="#00D5FF" stroke-width="1.5"/>
      <!-- Smile -->
      <path d="M 38 48 Q 42.5 52 47 48" fill="none" stroke="#4A342B" stroke-width="1.2"/>
      <!-- Shoulders -->
      <path d="M 12 85 C 12 62 30 58 42.5 58 C 55 58 73 62 73 85 Z" fill="#14234A" stroke="#253560" stroke-width="1"/>
      <path d="M 33 60 L 42.5 75 L 52 60 Z" fill="#00D5FF" opacity="0.8"/>
      <!-- Headset band -->
      <path d="M 22 38 C 22 22 32 14 42.5 14 C 53 14 63 22 63 38" fill="none" stroke="#E34DDB" stroke-width="2"/>
    </g>

    <!-- Developer Name -->
    <text x="140" y="176" text-anchor="middle" fill="#F4F7FF" font-size="16" font-weight="800" class="font-sans">Himanshu Singh</text>
    
    <!-- Title / Role Badge -->
    <g transform="translate(50, 186)">
      <rect x="0" y="0" width="180" height="20" rx="4" fill="#0F2448" stroke="#1D4A77" stroke-width="1"/>
      <text x="90" y="14" text-anchor="middle" fill="#00D5FF" font-size="9.5" font-weight="700" letter-spacing="1" class="font-mono">CLOUD &amp; DEVOPS ARCHITECT</text>
    </g>

    <!-- Metadata Details -->
    <g transform="translate(42, 222)">
      <text x="0" y="0" fill="#7284AC" font-size="8" class="font-mono">RANK: S-TIER</text>
      <text x="0" y="10" fill="#7284AC" font-size="8" class="font-mono">ID: #5619-CLOUD</text>
      <text x="110" y="0" fill="#7284AC" font-size="8" class="font-mono">SEC: VERIFIED</text>
      <text x="110" y="10" fill="#7284AC" font-size="8" class="font-mono">STACK: CLOUD-NATIVE</text>
    </g>

    <!-- Barcode Strip at bottom of ID -->
    <g transform="translate(42, 245)" fill="#00D5FF" opacity="0.7">
      <rect x="0" y="0" width="2" height="18"/>
      <rect x="4" y="0" width="4" height="18"/>
      <rect x="10" y="0" width="2" height="18"/>
      <rect x="14" y="0" width="1" height="18"/>
      <rect x="17" y="0" width="5" height="18"/>
      <rect x="24" y="0" width="2" height="18"/>
      <rect x="28" y="0" width="3" height="18"/>
      <rect x="33" y="0" width="1" height="18"/>
      <rect x="36" y="0" width="4" height="18"/>
      <rect x="42" y="0" width="2" height="18"/>
      <rect x="46" y="0" width="5" height="18"/>
      <rect x="53" y="0" width="1" height="18"/>
      <rect x="56" y="0" width="3" height="18"/>
      <rect x="61" y="0" width="2" height="18"/>
      <rect x="65" y="0" width="4" height="18"/>
      <rect x="71" y="0" width="2" height="18"/>
      <rect x="75" y="0" width="6" height="18"/>
      <rect x="83" y="0" width="2" height="18"/>
      <rect x="87" y="0" width="4" height="18"/>
      <rect x="93" y="0" width="1" height="18"/>
      <rect x="96" y="0" width="3" height="18"/>
      <rect x="101" y="0" width="5" height="18"/>
      <rect x="108" y="0" width="2" height="18"/>
      <rect x="112" y="0" width="3" height="18"/>
      <rect x="117" y="0" width="1" height="18"/>
      <rect x="120" y="0" width="4" height="18"/>
      <rect x="126" y="0" width="2" height="18"/>
      <rect x="130" y="0" width="5" height="18"/>
      <rect x="137" y="0" width="2" height="18"/>
      <rect x="141" y="0" width="4" height="18"/>
      <rect x="147" y="0" width="3" height="18"/>
      <rect x="152" y="0" width="2" height="18"/>
      <rect x="156" y="0" width="5" height="18"/>
      <rect x="163" y="0" width="2" height="18"/>
      <rect x="167" y="0" width="4" height="18"/>
      <rect x="173" y="0" width="1" height="18"/>
      <rect x="176" y="0" width="4" height="18"/>
      <rect x="182" y="0" width="2" height="18"/>
      <rect x="186" y="0" width="5" height="18"/>
      <rect x="193" y="0" width="3" height="18"/>
    </g>
  </g>

  <!-- ==================== RIGHT: STATS & PROJECT PROGRESS BARS ==================== -->
  <g transform="translate(325, 75)">
    <!-- 4 Top Metric Cards (matching reference layout!) -->
    <g>
      <!-- Metric 1: Repos -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="120" height="52" rx="8" fill="#101D40" stroke="#1F3668" stroke-width="1"/>
        <text x="14" y="24" fill="#00D5FF" font-size="18" font-weight="900" class="font-sans">29</text>
        <text x="14" y="40" fill="#7284AC" font-size="9" font-weight="700" letter-spacing="0.5" class="font-mono">PUBLIC REPOS</text>
      </g>

      <!-- Metric 2: IaC Focus -->
      <g transform="translate(130, 0)">
        <rect x="0" y="0" width="120" height="52" rx="8" fill="#101D40" stroke="#1F3668" stroke-width="1"/>
        <text x="14" y="24" fill="#9457FF" font-size="18" font-weight="900" class="font-sans">100%</text>
        <text x="14" y="40" fill="#7284AC" font-size="9" font-weight="700" letter-spacing="0.5" class="font-mono">IAC AUTOMATION</text>
      </g>

      <!-- Metric 3: Multi-Cloud -->
      <g transform="translate(260, 0)">
        <rect x="0" y="0" width="120" height="52" rx="8" fill="#101D40" stroke="#1F3668" stroke-width="1"/>
        <text x="14" y="24" fill="#26D7B5" font-size="18" font-weight="900" class="font-sans">3+</text>
        <text x="14" y="40" fill="#7284AC" font-size="9" font-weight="700" letter-spacing="0.5" class="font-mono">CLOUD PLATFORMS</text>
      </g>

      <!-- Metric 4: CI/CD -->
      <g transform="translate(390, 0)">
        <rect x="0" y="0" width="120" height="52" rx="8" fill="#101D40" stroke="#1F3668" stroke-width="1"/>
        <text x="14" y="24" fill="#E34DDB" font-size="18" font-weight="900" class="font-sans">24/7</text>
        <text x="14" y="40" fill="#7284AC" font-size="9" font-weight="700" letter-spacing="0.5" class="font-mono">CI/CD DEPLOY</text>
      </g>
    </g>

    <!-- Subtitle: MOST-STARRED & CORE PROJECTS -->
    <g transform="translate(0, 78)">
      <text x="0" y="0" fill="#7284AC" font-size="11" font-weight="700" letter-spacing="1" class="font-mono">CORE REPOSITORIES &amp; ARCHITECTURES</text>
    </g>

    <!-- Horizontal Progress Bars (matching reference screenshot!) -->
    <g transform="translate(0, 92)">
      <!-- Project 1: Cloud-Cost-Optimizer -->
      <g transform="translate(0, 0)">
        <text x="0" y="12" fill="#F4F7FF" font-size="11.5" font-weight="600" class="font-sans">Cloud-Cost-Optimizer (Terraform &amp; AWS)</text>
        <rect x="0" y="18" width="440" height="9" rx="4.5" fill="#0C1530"/>
        <rect x="0" y="18" width="418" height="9" rx="4.5" fill="url(#barGrad1)"/>
        <text x="455" y="26" fill="#00D5FF" font-size="11" font-weight="700" class="font-mono">95%</text>
      </g>

      <!-- Project 2: Docker-Container -->
      <g transform="translate(0, 36)">
        <text x="0" y="12" fill="#F4F7FF" font-size="11.5" font-weight="600" class="font-sans">Docker-Container (Microservices Deployment)</text>
        <rect x="0" y="18" width="440" height="9" rx="4.5" fill="#0C1530"/>
        <rect x="0" y="18" width="396" height="9" rx="4.5" fill="url(#barGrad2)"/>
        <text x="455" y="26" fill="#E34DDB" font-size="11" font-weight="700" class="font-mono">90%</text>
      </g>

      <!-- Project 3: fastapi-dockerize -->
      <g transform="translate(0, 72)">
        <text x="0" y="12" fill="#F4F7FF" font-size="11.5" font-weight="600" class="font-sans">fastapi--dockerize (CI/CD GitHub Actions)</text>
        <rect x="0" y="18" width="440" height="9" rx="4.5" fill="#0C1530"/>
        <rect x="0" y="18" width="374" height="9" rx="4.5" fill="url(#barGrad1)"/>
        <text x="455" y="26" fill="#00D5FF" font-size="11" font-weight="700" class="font-mono">85%</text>
      </g>

      <!-- Project 4: Monitoring Prometheus & Grafana -->
      <g transform="translate(0, 108)">
        <text x="0" y="12" fill="#F4F7FF" font-size="11.5" font-weight="600" class="font-sans">MonitoringWithPrometheusAndGrafana</text>
        <rect x="0" y="18" width="440" height="9" rx="4.5" fill="#0C1530"/>
        <rect x="0" y="18" width="360" height="9" rx="4.5" fill="url(#barGrad2)"/>
        <text x="455" y="26" fill="#E34DDB" font-size="11" font-weight="700" class="font-mono">82%</text>
      </g>

      <!-- Project 5: Streamlit-Dashboard -->
      <g transform="translate(0, 144)">
        <text x="0" y="12" fill="#F4F7FF" font-size="11.5" font-weight="600" class="font-sans">Streamlit-Dashboard (Real-time Analytics)</text>
        <rect x="0" y="18" width="440" height="9" rx="4.5" fill="#0C1530"/>
        <rect x="0" y="18" width="343" height="9" rx="4.5" fill="url(#barGrad1)"/>
        <text x="455" y="26" fill="#00D5FF" font-size="11" font-weight="700" class="font-mono">78%</text>
      </g>
    </g>
  </g>
</svg>
