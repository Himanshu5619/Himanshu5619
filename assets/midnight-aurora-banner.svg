<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="100%" height="100%">
  <defs>
    <!-- Aurora Gradients -->
    <linearGradient id="auroraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B16"/>
      <stop offset="50%" stop-color="#0E1428"/>
      <stop offset="100%" stop-color="#121B35"/>
    </linearGradient>

    <linearGradient id="auroraFlow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#A78BFA" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#F472B6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6EE7B7" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="auroraFlow2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#080B16" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="cyanViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .font-mono { font-family: 'Fira Code', 'Courier New', monospace; }
      .font-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      
      @keyframes floatCloud {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-5px) scale(1.02); }
      }
      @keyframes twinkleStar {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.9; }
      }
      @keyframes waveFlow {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(25px); }
      }
      .aurora-wave { animation: waveFlow 12s ease-in-out infinite; }
      .floating-node { animation: floatCloud 6s ease-in-out infinite; }
      .star-1 { animation: twinkleStar 3s ease-in-out infinite; }
      .star-2 { animation: twinkleStar 4s ease-in-out infinite 1.5s; }
      .star-3 { animation: twinkleStar 2.5s ease-in-out infinite 0.7s; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect x="2" y="2" width="956" height="246" rx="20" fill="url(#auroraBg)" stroke="#293451" stroke-width="1.5"/>

  <!-- Subtle Constellation Stars -->
  <g fill="#FFFFFF">
    <circle cx="80" cy="45" r="1" class="star-1"/>
    <circle cx="160" cy="85" r="1.5" class="star-2"/>
    <circle cx="220" cy="35" r="1" class="star-3"/>
    <circle cx="340" cy="90" r="1" class="star-1"/>
    <circle cx="480" cy="30" r="1.5" class="star-2"/>
    <circle cx="620" cy="75" r="1" class="star-3"/>
    <circle cx="750" cy="40" r="1.5" class="star-1"/>
    <circle cx="850" cy="95" r="1" class="star-2"/>
    <circle cx="890" cy="40" r="1" class="star-3"/>
    <circle cx="120" cy="180" r="1" class="star-2"/>
    <circle cx="820" cy="190" r="1.2" class="star-1"/>
  </g>

  <!-- Aurora Borealis Waves in Background -->
  <g class="aurora-wave">
    <path d="M -50 140 Q 200 40 450 120 T 980 90 L 980 250 L -50 250 Z" fill="url(#auroraFlow1)"/>
    <path d="M 0 170 Q 250 80 550 150 T 1020 110 L 1020 250 L 0 250 Z" fill="url(#auroraFlow2)"/>
  </g>

  <!-- Interconnected Cloud Network Nodes (Top-Right) -->
  <g transform="translate(680, 25)" opacity="0.6" class="floating-node">
    <line x1="60" y1="40" x2="130" y2="25" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="130" y1="25" x2="190" y2="60" stroke="#A78BFA" stroke-width="1"/>
    <line x1="60" y1="40" x2="100" y2="100" stroke="#F472B6" stroke-width="1"/>
    <line x1="100" y1="100" x2="180" y2="110" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="190" y1="60" x2="180" y2="110" stroke="#6EE7B7" stroke-width="1"/>

    <circle cx="60" cy="40" r="4" fill="#38BDF8"/>
    <circle cx="130" cy="25" r="5" fill="#A78BFA"/>
    <circle cx="190" cy="60" r="4.5" fill="#F472B6"/>
    <circle cx="100" cy="100" r="3.5" fill="#6EE7B7"/>
    <circle cx="180" cy="110" r="4" fill="#38BDF8"/>
  </g>

  <!-- Ambient Light Glow behind Typography -->
  <ellipse cx="480" cy="130" rx="350" ry="80" fill="#A78BFA" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Centered Content -->
  <g transform="translate(480, 50)" text-anchor="middle">
    <!-- Top Eyebrow Badge -->
    <g transform="translate(0, 0)">
      <rect x="-140" y="0" width="280" height="26" rx="13" fill="#10172A" stroke="#293451" stroke-width="1.2"/>
      <circle cx="-120" cy="13" r="4" fill="#38BDF8"/>
      <text x="5" y="17" fill="#38BDF8" font-size="10.5" font-weight="700" letter-spacing="1.5" class="font-mono">NEXT-GEN CLOUD &amp; DEVOPS</text>
    </g>

    <!-- Main Name Title -->
    <text x="0" y="78" fill="url(#textGrad)" font-size="44" font-weight="900" letter-spacing="1.5" class="font-sans">HIMANSHU SINGH</text>

    <!-- Colored Accent Underline / Horizon -->
    <rect x="-180" y="94" width="360" height="2.5" rx="1.2" fill="url(#cyanViolet)"/>

    <!-- Professional Subtitle -->
    <text x="0" y="125" fill="#A78BFA" font-size="14.5" font-weight="600" letter-spacing="0.5" class="font-sans">Cloud Architect • DevOps Engineer • Full-Stack Developer</text>

    <!-- Verified Academic Credentials -->
    <text x="0" y="152" fill="#94A3B8" font-size="12" class="font-mono">B.Tech Computer Science (Cloud Computing &amp; Virtualization) • UPES Dehradun</text>
  </g>
</svg>
