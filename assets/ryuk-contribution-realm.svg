<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&amp;family=JetBrains+Mono:wght@500;700;800&amp;family=Inter:wght@600;700;800&amp;display=swap');
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      .font-sans { font-family: 'Inter', -apple-system, sans-serif; }
      .font-gothic { font-family: 'Cinzel', serif; }

      @keyframes floatRyukVoid {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(2deg); }
      }
      @keyframes pulseRadar {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(255, 30, 39, 0.4)); }
        50% { filter: drop-shadow(0 0 14px rgba(255, 30, 39, 0.8)); }
      }
      @keyframes voxelGlow {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; filter: brightness(1.2); }
      }

      .ryuk-float-matrix { animation: floatRyukVoid 4s infinite ease-in-out; }
      .radar-glow { animation: pulseRadar 3s infinite ease-in-out; }
      .voxel-active { animation: voxelGlow 2.5s infinite ease-in-out; }
    </style>

    <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080C"/>
      <stop offset="50%" stop-color="#100C16"/>
      <stop offset="100%" stop-color="#060609"/>
    </linearGradient>

    <!-- Isometric Plane Gradient -->
    <linearGradient id="isoPlaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0D18"/>
      <stop offset="50%" stop-color="#2D1120"/>
      <stop offset="100%" stop-color="#0B0912"/>
    </linearGradient>

    <linearGradient id="radarFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Voxel Gradients -->
    <linearGradient id="vCrimsonTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D55"/>
      <stop offset="100%" stop-color="#FF1E27"/>
    </linearGradient>
    <linearGradient id="vCrimsonSide1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="vCrimsonSide2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </linearGradient>

    <linearGradient id="vPurpleTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="vPurpleSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect x="2" y="2" width="956" height="376" rx="14" fill="url(#matrixBg)" stroke="#351A24" stroke-width="1.5"/>

  <!-- Titlebar -->
  <path d="M 2 14 Q 2 2 14 2 L 946 2 Q 958 2 958 14 L 958 36 L 2 36 Z" fill="#11121C"/>
  <line x1="2" y1="36" x2="958" y2="36" stroke="#2B1A24" stroke-width="1"/>
  <text x="24" y="23" fill="#FF1E27" font-size="11" font-weight="900" letter-spacing="1.5" class="font-gothic">// SHINIGAMI REALM // CONTRIBUTION VOID &amp; TELEMETRY</text>
  <text x="936" y="23" text-anchor="end" fill="#64748B" font-size="10.5" font-weight="600" class="font-mono">himanshu@shinigami:~$ ./telemetry --radar</text>

  <!-- ==================== LEFT: DONUT CHART OF SACRED LANGUAGES ==================== -->
  <g transform="translate(30, 56)">
    <text x="0" y="16" fill="#E2E8F0" font-size="12" font-weight="800" class="font-mono">LANGUAGE DOMAIN</text>
    <text x="0" y="32" fill="#64748B" font-size="9.5" class="font-mono">Core languages in production</text>

    <!-- Donut SVG Geometry -->
    <g transform="translate(100, 135)">
      <!-- Circle Background -->
      <circle cx="0" cy="0" r="64" fill="none" stroke="#161824" stroke-width="24"/>
      
      <!-- Segment 1: Python (45% = 180 of 402 circumference) -->
      <circle cx="0" cy="0" r="64" fill="none" stroke="#FF1E27" stroke-width="24"
        stroke-dasharray="180 222" stroke-dashoffset="0" transform="rotate(-90)"/>

      <!-- Segment 2: Terraform / HCL (25% = 100 of 402) -->
      <circle cx="0" cy="0" r="64" fill="none" stroke="#7C3AED" stroke-width="24"
        stroke-dasharray="100 302" stroke-dashoffset="-180" transform="rotate(-90)"/>

      <!-- Segment 3: Docker / Shell (18% = 72 of 402) -->
      <circle cx="0" cy="0" r="64" fill="none" stroke="#38BDF8" stroke-width="24"
        stroke-dasharray="72 330" stroke-dashoffset="-280" transform="rotate(-90)"/>

      <!-- Segment 4: JavaScript / TypeScript (12% = 50 of 402) -->
      <circle cx="0" cy="0" r="64" fill="none" stroke="#34D399" stroke-width="24"
        stroke-dasharray="50 352" stroke-dashoffset="-352" transform="rotate(-90)"/>

      <!-- Center Text -->
      <text x="0" y="-4" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="900" class="font-sans">100%</text>
      <text x="0" y="12" text-anchor="middle" fill="#64748B" font-size="8.5" font-weight="700" class="font-mono">CODEBASE</text>
    </g>

    <!-- Legend -->
    <g transform="translate(10, 230)">
      <!-- Python -->
      <circle cx="6" cy="6" r="4.5" fill="#FF1E27"/>
      <text x="18" y="9" fill="#E2E8F0" font-size="10.5" font-weight="700" class="font-mono">Python <tspan fill="#64748B" font-weight="500">(45%)</tspan></text>

      <!-- Terraform -->
      <circle cx="110" cy="6" r="4.5" fill="#7C3AED"/>
      <text x="122" y="9" fill="#E2E8F0" font-size="10.5" font-weight="700" class="font-mono">Terraform <tspan fill="#64748B" font-weight="500">(25%)</tspan></text>

      <!-- Docker / Shell -->
      <circle cx="6" cy="26" r="4.5" fill="#38BDF8"/>
      <text x="18" y="29" fill="#E2E8F0" font-size="10.5" font-weight="700" class="font-mono">Docker/Bash <tspan fill="#64748B" font-weight="500">(18%)</tspan></text>

      <!-- JS / TS -->
      <circle cx="110" cy="26" r="4.5" fill="#34D399"/>
      <text x="122" y="29" fill="#E2E8F0" font-size="10.5" font-weight="700" class="font-mono">JS / TS <tspan fill="#64748B" font-weight="500">(12%)</tspan></text>
    </g>
  </g>

  <!-- Divider Line 1 -->
  <line x1="255" y1="50" x2="255" y2="350" stroke="#1F2130" stroke-width="1.2"/>

  <!-- ==================== CENTER: 3D ISOMETRIC CONTRIBUTION VOID ==================== -->
  <g transform="translate(270, 56)">
    <!-- Header -->
    <text x="0" y="16" fill="#E2E8F0" font-size="12" font-weight="800" class="font-mono">CONTRIBUTION REALM</text>
    <text x="0" y="32" fill="#FF1E27" font-size="9.5" class="font-mono">"Every commit raises an obelisk in the human cloud."</text>

    <!-- Isometric Contribution Grid Base (Skewed 3D plane) -->
    <g transform="translate(195, 230) scale(1, 0.5) rotate(-45)">
      <!-- Ground plane shadow -->
      <rect x="-110" y="-110" width="220" height="220" fill="url(#isoPlaneGrad)" stroke="#3F1728" stroke-width="2"/>
      
      <!-- Grid Lines -->
      <g stroke="#261622" stroke-width="1">
        <line x1="-110" y1="-70" x2="110" y2="-70"/>
        <line x1="-110" y1="-30" x2="110" y2="-30"/>
        <line x1="-110" y1="10" x2="110" y2="10"/>
        <line x1="-110" y1="50" x2="110" y2="50"/>
        <line x1="-110" y1="90" x2="110" y2="90"/>

        <line x1="-70" y1="-110" x2="-70" y2="110"/>
        <line x1="-30" y1="-110" x2="-30" y2="110"/>
        <line x1="10" y1="-110" x2="10" y2="110"/>
        <line x1="50" y1="-110" x2="50" y2="110"/>
        <line x1="90" y1="-110" x2="90" y2="110"/>
      </g>
    </g>

    <!-- 3D Extruded Voxels (Rising Bars) -->
    <!-- Group of extruded columns -->
    <g transform="translate(195, 215)">
      <!-- Voxel 1 (Center Tall Crimson) -->
      <g class="voxel-active" transform="translate(0, -35)">
        <!-- Top Face -->
        <polygon points="0,-24 20,-12 0,0 -20,-12" fill="url(#vCrimsonTop)"/>
        <!-- Left Face -->
        <polygon points="-20,-12 0,0 0,45 -20,33" fill="url(#vCrimsonSide1)"/>
        <!-- Right Face -->
        <polygon points="0,0 20,-12 20,33 0,45" fill="url(#vCrimsonSide2)"/>
      </g>

      <!-- Voxel 2 (Left Purple) -->
      <g transform="translate(-32, -10)">
        <polygon points="0,-16 16,-8 0,0 -16,-8" fill="url(#vPurpleTop)"/>
        <polygon points="-16,-8 0,0 0,30 -16,22" fill="url(#vPurpleSide)"/>
        <polygon points="0,0 16,-8 16,22 0,30" fill="#4C1D95"/>
      </g>

      <!-- Voxel 3 (Right Purple) -->
      <g transform="translate(32, -5)">
        <polygon points="0,-18 16,-9 0,0 -16,-9" fill="url(#vPurpleTop)"/>
        <polygon points="-16,-9 0,0 0,35 -16,26" fill="url(#vPurpleSide)"/>
        <polygon points="0,0 16,-9 16,26 0,35" fill="#4C1D95"/>
      </g>

      <!-- Voxel 4 (Back Crimson) -->
      <g transform="translate(-15, -60)">
        <polygon points="0,-20 18,-10 0,0 -18,-10" fill="url(#vCrimsonTop)"/>
        <polygon points="-18,-10 0,0 0,40 -18,30" fill="url(#vCrimsonSide1)"/>
        <polygon points="0,0 18,-10 18,30 0,40" fill="url(#vCrimsonSide2)"/>
      </g>

      <!-- Voxel 5 (Front Cyan) -->
      <g transform="translate(15, 15)">
        <polygon points="0,-14 14,-7 0,0 -14,-7" fill="#38BDF8"/>
        <polygon points="-14,-7 0,0 0,25 -14,18" fill="#0284C7"/>
        <polygon points="0,0 14,-7 14,18 0,25" fill="#0369A1"/>
      </g>
    </g>

    <!-- Floating Ryuk Hovering Above the 3D Grid -->
    <g class="ryuk-float-matrix" transform="translate(195, 60)">
      <!-- Soft Shadow below him -->
      <ellipse cx="0" cy="80" rx="36" ry="10" fill="#FF1E27" opacity="0.25"/>

      <!-- Wings Outstretched -->
      <path d="M -20 -10 C -55 -40 -95 -20 -115 5 C -85 10 -50 15 -20 5 Z" fill="#0E1018" stroke="#371B26" stroke-width="1.2"/>
      <path d="M 20 -10 C 55 -40 95 -20 115 5 C 85 10 50 15 20 5 Z" fill="#0E1018" stroke="#371B26" stroke-width="1.2"/>

      <!-- Body & Spiky Mantle -->
      <path d="M -16 12 C -14 0 14 0 16 12 L 20 38 L -20 38 Z" fill="#131522" stroke="#2B2F44" stroke-width="1"/>
      <!-- Face -->
      <ellipse cx="0" cy="-6" rx="13" ry="15" fill="#D1D5DB"/>
      <!-- Wild Hair -->
      <path d="M -13 -12 L -20 -22 L -11 -17 L -5 -28 L 0 -18 L 5 -28 L 11 -17 L 20 -22 L 13 -12 Z" fill="#0A0B10"/>
      <!-- Eyes Glowing -->
      <circle cx="-5" cy="-8" r="3" fill="#FF1E27"/>
      <circle cx="-5" cy="-8" r="1.2" fill="#FEF08A"/>
      <circle cx="5" cy="-8" r="3" fill="#FF1E27"/>
      <circle cx="5" cy="-8" r="1.2" fill="#FEF08A"/>
      <!-- Menacing Grin -->
      <path d="M -7 -2 Q 0 6 7 -2" fill="#111827" stroke="#111827" stroke-width="0.8"/>

      <!-- Apple falling / held in hand -->
      <circle cx="16" cy="20" r="7" fill="#DC2626" stroke="#7F1D1D" stroke-width="0.8"/>
      <path d="M 16 14 Q 18 11 20 12" stroke="#16A34A" stroke-width="1" fill="none"/>
    </g>
  </g>

  <!-- Divider Line 2 -->
  <line x1="685" y1="50" x2="685" y2="350" stroke="#1F2130" stroke-width="1.2"/>

  <!-- ==================== RIGHT: 5-AXIS RADAR METRIC CHART ==================== -->
  <g transform="translate(710, 56)">
    <text x="0" y="16" fill="#E2E8F0" font-size="12" font-weight="800" class="font-mono">TACTICAL RADAR</text>
    <text x="0" y="32" fill="#64748B" font-size="9.5" class="font-mono">5-Dimension Combat Profile</text>

    <!-- Radar Chart Center (cx=110, cy=150) -->
    <g transform="translate(115, 150)">
      
      <!-- Concentric Pentagons (Grid Rings) -->
      <!-- Ring 1 (100%) -->
      <polygon points="0,-75 71,-23 44,61 -44,61 -71,-23" fill="none" stroke="#2A2D40" stroke-width="1"/>
      <!-- Ring 2 (75%) -->
      <polygon points="0,-56 53,-17 33,45 -33,45 -53,-17" fill="none" stroke="#222533" stroke-width="1"/>
      <!-- Ring 3 (50%) -->
      <polygon points="0,-37 35,-11 22,30 -22,30 -35,-11" fill="none" stroke="#1A1C28" stroke-width="1"/>
      <!-- Ring 4 (25%) -->
      <polygon points="0,-18 17,-5 11,15 -11,15 -17,-5" fill="none" stroke="#151722" stroke-width="1"/>

      <!-- 5 Axis Radial Lines from center -->
      <line x1="0" y1="0" x2="0" y2="-75" stroke="#34384E" stroke-width="1"/>
      <line x1="0" y1="0" x2="71" y2="-23" stroke="#34384E" stroke-width="1"/>
      <line x1="0" y1="0" x2="44" y2="61" stroke="#34384E" stroke-width="1"/>
      <line x1="0" y1="0" x2="-44" y2="61" stroke="#34384E" stroke-width="1"/>
      <line x1="0" y1="0" x2="-71" y2="-23" stroke="#34384E" stroke-width="1"/>

      <!-- Filled Shinigami Radar Polygon:
           Top: Commits (96% = -72)
           Top-Right: Architecture (92% = (65, -21))
           Bottom-Right: IaC & Cloud (95% = (42, 58))
           Bottom-Left: Observability (90% = (-40, 55))
           Top-Left: Bug Kill (98% = (-70, -22))
      -->
      <polygon points="0,-72 65,-21 42,58 -40,55 -70,-22" fill="url(#radarFill)" stroke="#FF1E27" stroke-width="1.8" class="radar-glow"/>

      <!-- Vertex Dots -->
      <circle cx="0" cy="-72" r="3.5" fill="#FF1E27"/>
      <circle cx="65" cy="-21" r="3.5" fill="#FF1E27"/>
      <circle cx="42" cy="58" r="3.5" fill="#A855F7"/>
      <circle cx="-40" cy="55" r="3.5" fill="#38BDF8"/>
      <circle cx="-70" cy="-22" r="3.5" fill="#FF1E27"/>

      <!-- Axis Labels -->
      <text x="0" y="-84" text-anchor="middle" fill="#F8FAFC" font-size="9" font-weight="700" class="font-mono">COMMITS</text>
      <text x="78" y="-18" text-anchor="start" fill="#F8FAFC" font-size="9" font-weight="700" class="font-mono">ARCH</text>
      <text x="46" y="74" text-anchor="start" fill="#A855F7" font-size="9" font-weight="700" class="font-mono">IaC/CLOUD</text>
      <text x="-48" y="74" text-anchor="end" fill="#38BDF8" font-size="9" font-weight="700" class="font-mono">OBSERVE</text>
      <text x="-78" y="-18" text-anchor="end" fill="#FF4D55" font-size="9" font-weight="700" class="font-mono">HOTFIX</text>
    </g>

    <!-- Bottom label -->
    <text x="115" y="275" text-anchor="middle" fill="#64748B" font-size="9" class="font-mono">OVERALL RATING: S-RANK SHINIGAMI</text>
  </g>
</svg>

