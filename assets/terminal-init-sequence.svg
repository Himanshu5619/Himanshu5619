<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', 'Fira Code', monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: blink 1s infinite steps(1); }
      .cmd-text { fill: #8B949E; font-size: 13px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="1" y="1" width="958" height="298" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>

  <!-- Titlebar -->
  <path d="M 1 12 Q 1 1 12 1 L 948 1 Q 959 1 959 12 L 959 36 L 1 36 Z" fill="#161B22"/>
  <line x1="1" y1="36" x2="959" y2="36" stroke="#30363D" stroke-width="1"/>

  <!-- Controls -->
  <circle cx="20" cy="18" r="5" fill="#FF5F56"/>
  <circle cx="36" cy="18" r="5" fill="#FFBD2E"/>
  <circle cx="52" cy="18" r="5" fill="#27C93F"/>

  <text x="74" y="22" fill="#C9D1D9" font-size="11.5" font-weight="600" class="font-mono">himanshu@dev:~ (bash)</text>
  <text x="940" y="22" text-anchor="end" fill="#34D399" font-size="11" font-weight="700" class="font-mono">● LIVE TERMINAL</text>

  <!-- Terminal Sequence Content -->
  <!-- Line 1: whoami -->
  <g transform="translate(26, 64)">
    <text x="0" y="0" class="cmd-text">himanshu@dev:~$ <tspan fill="#F0F6FC" font-weight="700">whoami</tspan></text>
    <text x="0" y="20" fill="#38BDF8" font-size="14" font-weight="800" class="font-sans">Himanshu Singh</text>
  </g>

  <!-- Line 2: cat about.md -->
  <g transform="translate(26, 116)">
    <text x="0" y="0" class="cmd-text">himanshu@dev:~$ <tspan fill="#F0F6FC" font-weight="700">cat about.md</tspan></text>
    <text x="0" y="22" fill="#FFFFFF" font-size="14" font-weight="700" class="font-sans">Hello, World! 👋 I'm Himanshu Singh.</text>
    <text x="0" y="40" fill="#94A3B8" font-size="12" font-weight="500" class="font-mono">Cloud Computing Enthusiast  •  DevOps &amp; Automation  •  Full-Stack Developer</text>
  </g>

  <!-- Line 3: initialize.sh -->
  <g transform="translate(26, 192)">
    <text x="0" y="0" class="cmd-text">himanshu@dev:~$ <tspan fill="#F0F6FC" font-weight="700">./initialize.sh</tspan></text>
    <g transform="translate(0, 18)">
      <text x="0" y="0" fill="#A855F7" font-size="12.5" font-weight="700" class="font-mono">[████████████████████] 100%</text>
      <text x="0" y="20" fill="#34D399" font-size="12" font-weight="700" class="font-mono">[OK] Profile initialized.</text>
      <text x="0" y="38" fill="#34D399" font-size="12" font-weight="700" class="font-mono">[OK] Systems ready.</text>
      <rect x="156" y="26" width="9" height="15" fill="#FFFFFF" class="cursor"/>
    </g>
  </g>
</svg>
